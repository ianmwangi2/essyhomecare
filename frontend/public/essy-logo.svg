<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 140" role="img" aria-labelledby="title desc">
  <title>Essy Homecare logo</title>
  <desc>Essy Homecare & Nursing Services logo with CHAP accreditation</desc>
  
  <!-- Main Text -->
  <g>
    <!-- "essy" in blue -->
    <text x="0" y="95" font-family="Arial, Helvetica, sans-serif" font-size="88" font-weight="bold" fill="#1B5E8A">essy</text>
    
    <!-- Green checkmark accent on the y -->
    <g transform="translate(125, 45)">
      <circle cx="0" cy="0" r="16" fill="#5DB75D" opacity="0.2" />
      <path d="M -8 -2 L -2 4 L 8 -6" stroke="#5DB75D" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    
    <!-- "homecare" in blue -->
    <text x="160" y="95" font-family="Arial, Helvetica, sans-serif" font-size="88" font-weight="bold" fill="#1B5E8A">homecare</text>
    
    <!-- Second line: "& Nursing Services" in green -->
    <text x="0" y="135" font-family="Arial, Helvetica, sans-serif" font-size="36" font-weight="600" fill="#5DB75D">&amp; Nursing Services</text>
  </g>
</svg>
