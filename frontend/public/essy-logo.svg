<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 40" role="img" aria-label="Essy Homecare logo">
  <defs>
    <style>
      .logo-text { font-family: Arial, sans-serif; font-weight: bold; font-size: 16px; fill: white; }
      .logo-sub { font-family: Arial, sans-serif; font-size: 6px; fill: #90EE90; letter-spacing: 0.5px; }
    </style>
  </defs>
  
  <!-- Main "essy homecare" text -->
  <text x="2" y="18" class="logo-text">essy homecare</text>
  
  <!-- Subtitle -->
  <text x="2" y="28" class="logo-sub">&amp; NURSING SERVICES</text>
  
  <!-- Green accent line -->
  <rect x="0" y="32" width="120" height="1" fill="#90EE90"/>
</svg>
